<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASUMES Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CẤU HÌNH --- */
        :root {
            /* Màu nền chính */
            --bg-dark: #09090b;
            
            /* Màu chữ tiêu đề */
            --fasumes-color: #ff1493; /* Hồng đậm/Đỏ rực của SuS và FAME trộn lại */
            
            /* Màu cho Clan và Vị trí */
            --sus-color: #ff003c;       /* ĐỎ SuS */
            --fame-color: #ffd700;     /* VÀNG FAME */
            
            /* Màu hiệu ứng Glassmorphism */
            --glass-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            
            /* Màu XP */
            --neon-green: #39ff14;     /* XANH LÁ NEON */
        }

        body {
            background-color: var(--bg-dark);
            /* Hiệu ứng nền pha trộn màu Đỏ và Hồng */
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(255, 0, 60, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(255, 20, 147, 0.1) 0%, transparent 45%);
            color: #e6edf3;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }
        
        /* --- TIÊU ĐỀ FASUMES MỚI --- */
        h1 {
            font-size: 3.5em;
            margin-top: 0;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: var(--fasumes-color);
            /* Hiệu ứng phát sáng và nhịp thở đặc trưng */
            text-shadow: 0 0 15px var(--fasumes-color), 0 0 30px rgba(255, 20, 147, 0.6);
            animation: pulse-fasumes 2.5s infinite alternate;
        }

        /* Biểu tượng cờ đua */
        .flag-icon {
            font-size: 0.8em;
            opacity: 0.9;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        /* --- BẢNG XẾP HẠNG --- */
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 20px;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.25em;
            font-weight: 600;
        }

        /* Hiệu ứng di chuột vào dòng */
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
            transition: all 0.3s ease;
        }

        /* --- PHÂN CHIA CLAN TRONG TÊN VÕ SĨ --- */
        .tag-sus { color: var(--sus-color); text-shadow: 0 0 8px rgba(255,0,60,0.5); }
        .tag-fame { color: var(--fame-color); text-shadow: 0 0 8px rgba(255,215,0,0.5); }

        /* --- HIỆU ỨNG VỊ TRÍ TOP --- */
        .rank-badge { display: inline-block; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; text-align: center; font-weight: bold; color: #000; }
        
        .top-1 { background: linear-gradient(45deg, #ffd700, #fffacd); box-shadow: 0 0 20px var(--fame-color); }
        .row-top-1 td { color: var(--fame-color); text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }

        .top-2 { background: linear-gradient(45deg, #c0c0c0, #ffffff); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        
        .top-3 { background: linear-gradient(45deg, #cd7f32, #ffcc99); box-shadow: 0 0 15px rgba(230,160,115,0.3); }

        /* --- MÀU CỘT XP GAIED --- */
        .gained-xp { 
            color: var(--neon-green); 
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            font-weight: 700;
        }
        
        /* Cột Total XP màu xám mờ */
        .total-xp { font-family: 'Consolas', monospace; color: #a1a1aa; letter-spacing: -0.5px; }
        
        /* Hiệu ứng Animations */
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse-fasumes { 
            0% { text-shadow: 0 0 15px var(--fasumes-color); } 
            100% { text-shadow: 0 0 35px var(--fasumes-color), 0 0 10px #fff; transform: scale(1.02); } 
        }

        /* Media Query cho Mobile */
        @media (max-width: 768px) {
            h1 { font-size: 2.2em; gap: 8px; }
            td, th { padding: 12px 8px; font-size: 1em; }
        }
    </style>
</head>
<body>

    <h1>
        <span class="flag-icon">🏁</span> 
        <span>FASUMES</span> 
        <span class="flag-icon">🏁</span>
    </h1>

    <div class="container" id="rankingTable">
        <table>
            <thead>
                <tr>
                    <th width="10%">#</th>
                    <th width="40%" style="text-align:left; padding-left: 20px;">Fighter</th>
                    <th width="25%">Gained XP</th>
                    <th width="25%">Total XP</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="row-top-1">
                    <td style="text-align:center;"><span class="rank-badge top-1">1</span></td>
                    <td style="text-align:left; padding-left: 20px;"><span class="tag-fame">FAME</span> Novsonik</td>
                    <td class="gained-xp">+3,005,236,029</td>
                    <td class="total-xp">15,487,213,991</td>
                </tr>
                <tr class="row-top-2">
                    <td style="text-align:center;"><span class="rank-badge top-2">2</span></td>
                    <td style="text-align:left; padding-left: 20px;"><span class="tag-sus">SuS</span> Dominate</td>
                    <td class="gained-xp">+1,597,313,300</td>
                    <td class="total-xp">9,122,884,501</td>
                </tr>
                <tr class="row-top-3">
                    <td style="text-align:center;"><span class="rank-badge top-3">3</span></td>
                    <td style="text-align:left; padding-left: 20px;"><span class="tag-fame">FAME</span> Nz Jr</td>
                    <td class="gained-xp">+1,161,163,513</td>
                    <td class="total-xp">8,871,521,003</td>
                </tr>
                <tr>
                    <td style="text-align:center;">4</td>
                    <td style="text-align:left; padding-left: 20px;"><span class="tag-sus">SuS</span> QuangTong</td>
                    <td class="gained-xp">+1,055,176,395</td>
                    <td class="total-xp">7,951,421,884</td>
                </tr>
                <tr>
                    <td style="text-align:center;">5</td>
                    <td style="text-align:left; padding-left: 20px;"><span class="tag-fame">FAME</span> CriT</td>
                    <td class="gained-xp">+588,845,211</td>
                    <td class="total-xp">6,201,313,901</td>
                </tr>
                </tbody>
        </table>
    </div>

</body>
</html>
