<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASUMES - XP Race</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- CẤU HÌNH MÀU SẮC LIÊN GUILD --- */
        :root {
            --primary-color: #00f2ff; /* Xanh Neon */
            --sus-red: #ff003c;       /* ĐỎ SuS */
            --sus-dark: #3a000e;
            --fame-pink: #ff1493;     /* HỒNG FAME */
            --fame-dark: #4a002b;
            --bg-dark: #09090b;       /* Nền đen sâu */
            --glass-bg: rgba(22, 27, 34, 0.75); /* Màu kính mờ */
            --border-color: rgba(255, 255, 255, 0.1);
            --gold: #ffd700;
            --silver-cool: #e0f2ff;   /* BẠC COOL TOP 2 */
            --rich-bronze: #e6a073;    /* ĐỒNG ẤM TOP 3 */
            --neon-green: #39ff14;
        }

        body {
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
            position: relative; /* Để chứa các hạt bụi nền */
            overflow-x: hidden; /* Tránh hiện thanh cuộn ngang do bụi bay */
        }

        /* --- 🔴 HIỆU ỨNG NỀN ĐỘNG (FLOATING PARTICLES) --- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; /* Nằm dưới cùng */
            background-color: var(--bg-dark);
            /* Radial Gradient làm nền ảo giác màu Đỏ/Hồng */
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(255, 0, 60, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(255, 20, 147, 0.12) 0%, transparent 40%);
        }

        /* Container chứa các hạt bụi động */
        .bg-animation-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            pointer-events: none; 
        }

        /* Tạo 1 hạt bụi (class dùng chung) */
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            filter: blur(3px); 
            animation: float-particles infinite linear;
        }

        .p-1  { width: 4px; height: 4px; left: 10%; top: 110%; animation-duration: 15s; color: var(--sus-red); box-shadow: 0 0 10px var(--sus-red); animation-delay: 0s; }
        .p-2  { width: 3px; height: 3px; left: 30%; top: 110%; animation-duration: 22s; color: #fff; box-shadow: 0 0 8px #fff; animation-delay: 2s; }
        .p-3  { width: 5px; height: 5px; left: 50%; top: 110%; animation-duration: 18s; color: var(--fame-pink); box-shadow: 0 0 12px var(--fame-pink); animation-delay: 4s; }
        .p-4  { width: 3px; height: 3px; left: 70%; top: 110%; animation-duration: 25s; color: var(--primary-color); box-shadow: 0 0 8px var(--primary-color); animation-delay: 1s; }
        .p-5  { width: 4px; height: 4px; left: 85%; top: 110%; animation-duration: 19s; color: var(--sus-red); box-shadow: 0 0 10px var(--sus-red); animation-delay: 3s; }
        .p-6  { width: 2px; height: 2px; left: 95%; top: 110%; animation-duration: 30s; color: #fff; animation-delay: 5s; }
        .p-7  { width: 6px; height: 6px; left: 20%; top: 110%; animation-duration: 16s; color: var(--fame-pink); box-shadow: 0 0 12px var(--fame-pink); animation-delay: 6s; }
        .p-8  { width: 3px; height: 3px; left: 60%; top: 110%; animation-duration: 20s; color: var(--primary-color); box-shadow: 0 0 8px var(--primary-color); animation-delay: 0.5s; }

        @keyframes float-particles {
            0%   { transform: translateY(0); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        /* --- TIÊU ĐỀ LIÊN MINH (CẬP NHẬT MỚI) --- */
        .header-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* FASUMES Brand */
        .fasumes-brand {
            font-weight: 800;
            font-size: 4.5em; /* Chữ bự choán ngợp */
            color: var(--fame-pink);
            text-shadow: 0 0 15px var(--fame-pink), 0 0 30px rgba(255,20,147,0.6);
            animation: pulse-pink 2s infinite alternate-reverse;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 15px;
        }

        /* Hàng chứa XP Race và Kiếm */
        .sub-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .xp-event {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(0,242,255,0.6);
            opacity: 0.9;
        }

        .sword-icon {
            font-size: 2.5em;
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(0,242,255,0.5));
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1em;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* --- BẢNG XẾP HẠNG --- */
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
            position: relative; 
            z-index: 10;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 20px;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.25em;
            font-weight: 600;
        }

        tbody tr { transition: all 0.3s ease; }
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
            box-shadow: 0 0 15px rgba(0,0,0,0.3) inset;
        }

        /* Tag Guild trong Bảng */
        .tag-sus { color: var(--sus-red); text-shadow: 0 0 8px rgba(255,0,60,0.5); }
        .tag-fame { color: var(--fame-pink); text-shadow: 0 0 8px rgba(255,20,147,0.5); }

        /* Rank Badges & Colors */
        .rank-badge { display: inline-block; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; text-align: center; font-weight: bold; color: #000; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .top-1 { background: linear-gradient(45deg, #ffd700, #fffacd); box-shadow: 0 0 20px var(--gold); transform: scale(1.1); }
        .row-top-1 td { color: var(--gold); text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
        .row-top-1 td span.tag-sus, .row-top-1 td span.tag-fame { color: inherit !important; text-shadow: inherit !important; }

        .top-2 { background: linear-gradient(45deg, #c0c0c0, #ffffff); }
        .row-top-2 td { color: var(--silver-cool); text-shadow: 0 0 10px rgba(255,255,255,0.2), 0 0 5px rgba(0,242,255,0.1); }
